<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewBucks - Sign Up</title>
    <link rel="icon" href="images/logo-small.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a class="logo" href="index.html">
                <img src="images/logo-small.png" alt="">
                <span>BrewBucks</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="cart.html">Cart<span class="cart-badge" id="cartBadge" hidden>0</span></a></li>
                <li><a href="login.html" id="authLink">Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-section">
        <div class="login-box">
            <h1>Create Account</h1>
            <p>Join BrewBucks today</p>

            <form id="signupForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" autocomplete="name" required>

                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" autocomplete="email" required>

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>

                <button type="submit">Sign Up</button>
            </form>

            <p id="signupMessage" role="alert"></p>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 BrewBucks. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/signup.js"></script>

</body>
</html>
